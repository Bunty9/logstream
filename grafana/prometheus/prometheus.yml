global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: logstream-ingest
    static_configs:
      - targets: ['logstream-ingest:4318']
    metrics_path: /metrics

  - job_name: logstream-query
    static_configs:
      - targets: ['logstream-query:4319']
    metrics_path: /metrics

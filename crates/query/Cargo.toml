[package]
name = "logstream-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Grafana-compatible read API for logstream — thin SELECT layer over ClickHouse."

[lib]
name = "logstream_query"
path = "src/lib.rs"

[[bin]]
name = "logstream-query"
path = "src/main.rs"

[dependencies]
logstream-core = { path = "../core", version = "0.1.0" }
tokio = { workspace = true }
axum = { workspace = true }
# `limit` for `tower::limit::GlobalConcurrencyLimitLayer` (`--max-concurrent-queries`).
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
clickhouse = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
clap = { workspace = true }
# Not a workspace dep: only needed here for RFC3339 parsing on the
# query-time surface. Already in the lockfile transitively (the
# `clickhouse` crate itself depends on `time`), so this doesn't add a new
# crate to the dependency tree — just enables the `parsing` feature we use
# directly.
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
# `util` for `ServiceExt::oneshot` in handler tests; not needed by the
# binary itself, hence dev-only rather than bumping the shared feature set.
tower = { workspace = true, features = ["util"] }

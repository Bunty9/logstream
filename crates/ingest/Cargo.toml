[package]
name = "logstream-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OTLP-HTTP ingest binary for logstream — auth, bounded channel, ClickHouse batcher."

[[bin]]
name = "logstream-ingest"
path = "src/main.rs"

[dependencies]
logstream-core = { path = "../core" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["decompression-gzip"] }
sqlx = { workspace = true }
redis = { workspace = true }
clickhouse = { workspace = true }
prost = { workspace = true }
opentelemetry-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# `util` for `ServiceExt::oneshot` in handler tests; not needed by the
# binary itself, hence dev-only rather than bumping the shared feature set.
tower = { workspace = true, features = ["util"] }
blake3 = { workspace = true }
flate2 = "1"

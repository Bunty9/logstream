name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --no-fail-fast

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo +1.88 check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  bench:
    name: criterion (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 8123:8123

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logstream
          POSTGRES_PASSWORD: logstream
          POSTGRES_DB: logstream
        options: >-
          --health-cmd "pg_isready -U logstream -d logstream"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Apply ClickHouse schema
        run: |
          curl -fsS --data-binary @clickhouse/init.sql \
            http://localhost:8123/?default_format=TSV
        timeout-minutes: 1

      - name: Apply Postgres migrations
        run: |
          psql -v ON_ERROR_STOP=1 -U logstream -d logstream -f migrations/0001_init.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: logstream
        timeout-minutes: 1

      - name: cargo nextest (integration)
        run: cargo nextest run --workspace
        env:
          LOGSTREAM_IT_CLICKHOUSE_URL: http://localhost:8123
          LOGSTREAM_IT_PG_URL: postgres://logstream:logstream@localhost:5432/logstream
          LOGSTREAM_IT_REDIS_URL: redis://localhost:6379

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build .

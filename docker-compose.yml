services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # clickhouse-server 24.8 blocks network access for the `default` user
      # with an empty password unless this is set (otherwise only the
      # container's local unix socket / localhost is allowed).
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "${CH_HTTP_PORT:-8123}:8123"   # HTTP
      - "${CH_NATIVE_PORT:-9000}:9000"   # native
    volumes:
      - logstream_ch_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1, not localhost: inside this container "localhost"
      # resolves IPv6-first to ::1, which nothing listens on here (no
      # IPv6 loopback), so wget gets "connection refused" forever even
      # though the server is up and fine on 127.0.0.1 — verified by
      # `docker exec` (localhost fails, 127.0.0.1 succeeds instantly).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logstream
      POSTGRES_PASSWORD: logstream
      POSTGRES_DB: logstream
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - logstream_pg_data:/var/lib/postgresql/data
      - ./migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logstream -d logstream"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROM_PORT:-9090}:9090"
    volumes:
      - ./grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - logstream_prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      # API key for logstream datasource (dev-only default; set LOGSTREAM_GRAFANA_API_KEY env var in production)
      LOGSTREAM_GRAFANA_API_KEY: ${LOGSTREAM_GRAFANA_API_KEY:-TESTKEY}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
      # logstream-query has no `healthcheck:` (its distroless image ships
      # no shell/curl/wget to run one) — `service_healthy` here is invalid
      # config (compose refuses to start: a service with condition
      # service_healthy must define a healthcheck). Grafana's own Loki
      # datasource health check (run by the e2e script) is what actually
      # proves logstream-query is serving.
      logstream-query:
        condition: service_started
    volumes:
      - logstream_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  logstream-ingest:
    image: logstream:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOGSTREAM_BIND: 0.0.0.0:4318
      DATABASE_URL: postgres://logstream:logstream@postgres:5432/logstream
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: default
      RUST_LOG: info
      # Throughput tunables — see README's tunables table for what each one
      # trades off; overridable per-run (e.g. `LOGSTREAM_MAX_ROWS=100000
      # docker compose up`) without rebuilding the image.
      LOGSTREAM_MAX_ROWS: ${LOGSTREAM_MAX_ROWS:-50000}
      LOGSTREAM_FLUSH_MS: ${LOGSTREAM_FLUSH_MS:-200}
      LOGSTREAM_FLUSH_CONCURRENCY: ${LOGSTREAM_FLUSH_CONCURRENCY:-4}
    ports:
      - "${INGEST_PORT:-4318}:4318"
    entrypoint: ["/usr/local/bin/logstream-ingest"]

  logstream-query:
    image: logstream:local
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOGSTREAM_QUERY_BIND: 0.0.0.0:4319
      DATABASE_URL: postgres://logstream:logstream@postgres:5432/logstream
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: default
      RUST_LOG: info
    ports:
      - "${QUERY_PORT:-4319}:4319"
    entrypoint: ["/usr/local/bin/logstream-query"]

volumes:
  logstream_ch_data:
  logstream_pg_data:
  logstream_grafana_data:
  logstream_prom_data:
